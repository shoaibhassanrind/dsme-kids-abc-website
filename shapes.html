<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find the same shape · DSME Kids ABC Adventure</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="play-page">
<div class="scene" aria-hidden="true"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span><span class="orb o4"></span><span class="orb o5"></span></div>
<div class="play-brand">
  <img src="img/dsme_logo.webp" alt="Dawn School of Modern Education logo" width="72" height="58">
  <div>
    <p>Dawn School of Modern Education</p>
    <strong>Kids Shape Adventure</strong>
  </div>
</div>
<div class="play-top game-status">
  <a class="icon-btn" href="index.html">Home</a>
  <div class="play-stats">
    <span id="stars">★ 0</span>
    <span id="badge" class="badge-chip" hidden>0 Star Badge</span>
    <span id="streak">Streak 0</span>
  </div>
  <button type="button" class="icon-btn" id="music-btn">Music on</button>
  <button type="button" class="icon-btn" id="voice-btn">Phonics on</button>
</div>
<div class="track" aria-hidden="true"><span id="track"></span></div>
<main class="play-board" id="board"></main>
<audio id="dsme-song" src="audio/abc_song_full.wav" loop preload="auto" playsinline></audio>
<script src="sound.js?v=3"></script>
<script src="shapes.js?v=3"></script>
</body>
</html>
